name: Terraform

# Roda terraform plan em todo PR que mexe em infra/ (menos o bootstrap, que é
# manual/local de propósito) e comenta o plano no próprio PR. Ao entrar em
# main, faz o apply automático, autenticado via OIDC (secrets.AWS_DEPLOY_ROLE_ARN)
# — sem nenhuma chave de acesso estática guardada no GitHub.
on:
  pull_request:
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: sa-east-1
  TF_STATE_BUCKET: fluxr-terraform-state
  TF_LOCK_TABLE: fluxr-terraform-lock

jobs:
  terraform:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cada módulo novo (database, containers, ...) entra aqui quando
        # estiver pronto pra ser aplicado automaticamente.
        module: [network, database]
    defaults:
      run:
        working-directory: infra/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        env:
          # Endpoint global do STS em vez do regional (sa-east-1) — contas AWS
          # novas às vezes têm mais lag de propagação de IAM/OIDC nos
          # endpoints regionais do que no global. Se resolver, dá pra tentar
          # remover depois; se não resolver, não é isso.
          AWS_STS_REGIONAL_ENDPOINTS: legacy

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ matrix.module }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          PLAN_OUTPUT=$(terraform plan -no-color -input=false 2>&1)
          PLAN_EXIT=$?
          {
            echo 'stdout<<PLAN_EOF'
            echo "$PLAN_OUTPUT"
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $PLAN_EXIT
        continue-on-error: true

      - name: Comenta o plano no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `#### Terraform Plan — \`${{ matrix.module }}\` (${{ steps.plan.outcome }})\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 65000),
            });

      - name: Falha o job se o plan deu erro
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
